<!doctype html>
<html lang="pt-PT">
<head>
  <base target="_top"><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta do Coro</title>
  <style>
    :root{--blue:#172f70;--red:#df3b31;--yellow:#ffd400;--cream:#f7f4ec;--ink:#173046;--line:#dfe5e8}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(var(--blue) 270px,var(--cream) 270px) no-repeat;color:var(--ink);font-family:Arial,sans-serif}
    .wrap{max-width:1000px;margin:auto;padding:40px 18px 70px} header{position:relative;color:#fff;padding:0 0 38px}.logo{position:absolute;right:0;top:-16px;width:145px;height:108px;object-fit:contain;background:#fff;border-radius:12px;padding:5px} .eyebrow{color:var(--yellow);font-size:12px;font-weight:bold;letter-spacing:.15em}h1{margin:12px 0;font:52px Georgia,serif}.subtitle{color:#e1e7f2}
    .shell{overflow:hidden;background:#fffdfa;border-radius:18px;box-shadow:0 15px 40px #172f7030}.session,.content{padding:26px 32px}.session{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.status{margin:0;color:#637484}.hello{margin:4px 0 0;font:26px Georgia,serif}.login{border:0;border-radius:8px;background:var(--red);color:#fff;padding:13px 18px;font-weight:bold;cursor:pointer}.login[hidden]{display:none}
    .tabs{display:flex;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--line)}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;color:#637484;padding:12px 16px;font-weight:bold;cursor:pointer}.tab.active{background:var(--blue);color:#fff}.panel[hidden]{display:none}
    h2{margin:28px 0 14px;font:29px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:11px;padding:17px;background:#fff}.label{display:block;color:#637484;font-size:11px;font-weight:bold;letter-spacing:.07em;text-transform:uppercase}.value{display:block;margin-top:10px;font:29px Georgia,serif}.note{display:block;margin-top:6px;color:#637484;font-size:12px}
    .lists{display:grid;grid-template-columns:1fr 1fr;gap:28px}.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list small{color:#637484}.presente{color:#18794e}.atraso{color:#a56a00}.falta{color:#c1372b}
    .chart{display:flex;align-items:flex-end;gap:18px;height:210px;margin:0 0 30px;padding:18px 6px 0;border-bottom:2px solid var(--blue)}.column{position:relative;flex:1;height:100%}.bar{position:absolute;bottom:0;left:50%;width:min(50px,85%);transform:translateX(-50%);background:var(--blue);border-radius:7px 7px 0 0}.percentage{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:bold;white-space:nowrap}.month{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);color:#637484;font-size:11px;white-space:nowrap}
    @media(max-width:650px){body{background:linear-gradient(var(--blue) 230px,var(--cream) 230px) no-repeat}.wrap{padding:28px 12px 60px}.logo{width:84px;height:66px;top:-7px}header{padding-right:90px}h1{font-size:39px}.session,.content{padding:22px 18px}.session{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.lists{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap">
  <header><img class="logo" alt="ProVocal Ensemble" src="https://drive.google.com/thumbnail?id=1jkvyMQb6EU9Y7jdS7a6kpCdRaQlZ8T3I&sz=w1000"><div class="eyebrow">ÁREA RESERVADA</div><h1>Consulta do Coro</h1><div class="subtitle">Participação, valores e informação do coro.</div></header>
  <main class="shell"><section class="session"><div><p id="status" class="status">A verificar sessão…</p><p id="hello" class="hello" hidden></p></div><button id="login" class="login" hidden>Iniciar sessão com Google</button></section><section id="content" class="content" hidden></section></main>
</div>
<script>
const sessionId=<?!= JSON.stringify(sessao) ?>;
const euro=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'});
const byId=id=>document.getElementById(id);
function escapeHtml(value){const node=document.createElement('span');node.textContent=value;return node.innerHTML}
function list(items){if(!items.length)return '<p class="note">Sem registos.</p>';return '<ul class="list">'+items.map(item=>'<li><span><strong>'+escapeHtml(item.nomeConcerto||item.tipo+' · '+item.origem)+'</strong><br><small>'+escapeHtml(item.data)+'</small></span><strong class="'+escapeHtml(String(item.resposta).toLowerCase())+'">'+escapeHtml(item.resposta)+'</strong></li>').join('')+'</ul>'}
function chart(months){return '<div class="chart">'+months.map(item=>{const pct=Math.round(item.percentagem*100),height=Math.max(3,Math.round(pct*2.1));return '<div class="column"><strong class="percentage" style="bottom:'+(height+8)+'px">'+pct+'%</strong><i class="bar" style="height:'+height+'px"></i><span class="month">'+item.mes.slice(5)+'/'+item.mes.slice(2,4)+'</span></div>'}).join('')+'</div>'}
function card(label,value,note){return '<article class="card"><span class="label">'+label+'</span><strong class="value">'+value+'</strong>'+(note?'<span class="note">'+note+'</span>':'')+'</article>'}
function show(data){
  byId('status').textContent='Resumo atualizado pela última publicação';byId('hello').textContent='Olá, '+data.nome;byId('hello').hidden=false;
  const individual='<h2>O meu resumo</h2><div class="grid">'+card('Assiduidade',Math.round(data.assiduidade*100)+'%','desde 01/05/2026')+card('Ensaios',data.ensaiosFrequentados+' / '+data.ensaios,'frequentados / realizados')+card('Atividades',data.atividades+' / '+data.atividadesPossiveis,'realizadas / possíveis')+card('Pontos finais',data.valores.pontos.toFixed(2),'pontuação final')+'</div><h2>Os teus valores</h2><div class="grid">'+card('Valor final',euro.format(data.valores.final))+card('Fundo comum',euro.format(data.valores.fundoComum))+card('Individual',euro.format(data.valores.individual))+card('Apoios',euro.format(data.valores.apoios))+'</div><h2>Registos</h2><div class="lists"><section><h3>Ensaios</h3><p class="note">'+data.pontosObtidos+' / '+data.pontosMaximos+' pontos de assiduidade</p>'+list(data.ensaiosLista)+'</section><section><h3>Concertos</h3>'+list(data.concertosLista)+'</section></div><h2>Evolução mensal</h2>'+chart(data.evolucaoMensal);
  const global='<h2>Informação global do coro</h2><div class="grid">'+card('Fundo distribuível',euro.format(data.global.fundo))+card('Valor por ponto',euro.format(data.global.valorPorPonto))+card('Pontos finais do coro',data.global.pontos.toFixed(2))+'</div>';
  byId('content').innerHTML='<nav class="tabs"><button class="tab active" data-tab="individual">O meu resumo</button><button class="tab" data-tab="global">Coro</button></nav><section id="individual" class="panel">'+individual+'</section><section id="global" class="panel" hidden>'+global+'</section>';
  byId('content').querySelector('.tabs').addEventListener('click',event=>{const button=event.target.closest('.tab');if(!button)return;const own=button.dataset.tab==='individual';byId('individual').hidden=!own;byId('global').hidden=own;byId('content').querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab===button))});
  byId('content').hidden=false;
}
byId('login').addEventListener('click',()=>google.script.run.withSuccessHandler(url=>window.top.location.href=url).obterUrlLoginPortal());
if(sessionId){google.script.run.withSuccessHandler(show).withFailureHandler(()=>{byId('status').textContent='A sessão expirou. Inicia sessão novamente.';byId('login').hidden=false}).obterResumoGeralPortal(sessionId)}else{byId('status').textContent='Inicia sessão para consultar o teu resumo.';byId('login').hidden=false}
</script><style>.chart{position:relative;padding:0 6px;border-top:1px solid #dfe5e8;background:linear-gradient(to bottom,transparent calc(50% - .5px),#dfe5e8 calc(50% - .5px),#dfe5e8 calc(50% + .5px),transparent calc(50% + .5px))}.chart:before{position:absolute;top:3px;left:0;color:#637484;font-size:11px;content:'100%'}.chart:after{position:absolute;top:calc(50% - 9px);left:0;color:#637484;font-size:11px;content:'50%'}@media(max-width:650px){body{font-size:17px}.note,.list small{font-size:14px}.list li{font-size:16px;line-height:1.45}.label{font-size:12px}.value{font-size:30px}.tab{font-size:15px}}</style></body></html>
